# Reusable CD publish (ADR-031 f/g), generalising
# qp-infrastructure/.github/workflows/publish-sandbox.yml's already-proved
# shape: multi-arch `docker buildx build`, GHCR push under GITHUB_TOKEN
# `packages: write`, cosign KEYLESS signing (the job's own OIDC token as
# identity — no signing key anywhere to leak, secrets-and-tenancy rule 1),
# the digest written to the job summary AND a workflow output.
#
# It NEVER runs format/lint/tests — branch protection (merge-cycle's
# `cycle.py protect`) guarantees `main` only receives commits that already
# passed a PR's gate, so CD's only job is to publish what the gate already
# proved (ADR-031 f). The build is warm from the PR gate's own `image` job
# via `cache-from: type=gha` — the SAME cache scope key
# (`${{ github.repository }}`-scoped by GitHub, shared across workflows in
# one repo), so a merge's first CD build reuses layers the PR already
# built rather than starting cold.
#
# Some Dockerfiles need a private-repo BuildKit secret at build time (e.g.
# qp-gateway's cargo git dependency, qp-ingest's go.mod private modules) —
# this workflow mints the same QPMatrix installation token the gate
# workflows do and exposes it under BOTH `qpmatrix_token` and
# `qpsecondbrain_token` build-secret ids (QPMSEC-415: both names now
# resolve to the identical token since the org merge; an unreferenced
# secret id a Dockerfile does not mount is simply unused, never an error).
#
# Action pins verified live 2026-09-03 (repo-gates-and-hooks rule 8 — the
# same table publish-sandbox.yml's own header verified 2026-08-28,
# re-verified here):
#   gh api repos/actions/checkout/releases/latest --jq .tag_name                 -> v7.0.1  (sha 3d3c42e5aac5ba805825da76410c181273ba90b1)
#   gh api repos/docker/setup-qemu-action/releases/latest --jq .tag_name         -> v4.3.0  (sha 1f40c72289eff860ee54a304f1438e3cff362e0a; publish-sandbox.yml's v4.2.0 is one minor behind — bumped here)
#   gh api repos/docker/setup-buildx-action/releases/latest --jq .tag_name       -> v4.3.0  (sha 37fe631027851001ddb9b187196cc803df7f5f0e)
#   gh api repos/docker/login-action/releases/latest --jq .tag_name              -> v4.6.0  (sha dbcb813823bdd20940b903addbd779551569679f)
#   gh api repos/docker/metadata-action/releases/latest --jq .tag_name           -> v6.2.0  (sha dc802804100637a589fabce1cb79ff13a1411302)
#   gh api repos/docker/build-push-action/releases/latest --jq .tag_name         -> v7.3.0  (sha 53b7df96c91f9c12dcc8a07bcb9ccacbed38856a)
#   gh api repos/sigstore/cosign-installer/releases/latest --jq .tag_name        -> v4.1.2  (sha 6f9f17788090df1f26f669e9d70d6ae9567deba6)
#   gh api repos/actions/create-github-app-token/releases/latest --jq .tag_name  -> v3.2.0  (sha bcd2ba49218906704ab6c1aa796996da409d3eb1)
name: image-publish

on:
  workflow_call:
    inputs:
      image:
        description: Full GHCR image path, e.g. ghcr.io/qpmatrix/qp-gateway.
        type: string
        required: true
      dockerfile:
        type: string
        required: false
        default: Dockerfile
      context:
        type: string
        required: false
        default: "."
      platforms:
        type: string
        required: false
        default: linux/amd64
      private-deps:
        description: >-
          Comma- or newline-separated QPMatrix repo names this build needs
          a token for (see header). Empty skips the mint and passes no
          build secret.
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: The published image's content digest (sha256:...).
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: sigstore/cosign-installer@v4.1.2

      - if: inputs.private-deps != ''
        name: Mint QPMatrix installation token
        id: qpmatrix-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix
          repositories: ${{ inputs.private-deps }}

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=main-{{sha}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          secrets: |
            qpmatrix_token=${{ steps.qpmatrix-token.outputs.token }}
            qpsecondbrain_token=${{ steps.qpmatrix-token.outputs.token }}

      - name: Sign the published image (cosign keyless) and verify it
        env:
          IMAGE_REFERENCE: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/QPMatrix/qpm-gh-workflows/\.github/workflows/image-publish\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REFERENCE"

      - name: Record the published digest
        run: |
          {
            echo "## ${{ inputs.image }} published and signed"
            echo
            echo '```'
            echo "${{ inputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags: ${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
