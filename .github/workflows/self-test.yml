# Proves the reusable workflows in THIS repo actually work before any
# consumer's PR ever calls them (QPMSEC-570 scope item 2: "a broken
# reusable workflow is red in its own repo before any consumer sees it").
# Calls each of rust-gate.yml/go-gate.yml/python-gate.yml/ts-gate.yml
# against its own tiny in-repo fixture under fixtures/ (a `working-
# directory` input every gate workflow carries for exactly this reason —
# real callers leave it at "."), and image-publish.yml against
# fixtures/docker-hello's 3-line Dockerfile.
#
# Local relative `uses: ./.github/workflows/<file>.yml` reusable-workflow
# references are a GitHub Actions-supported shape for a workflow calling a
# sibling workflow in the SAME repository (unlike a local composite
# action, which needs an explicit second checkout to resolve) — no extra
# checkout step is needed here.
#
# The `image-publish` job only runs on `push`/`workflow_dispatch` (never
# `pull_request`) — it PUSHES a real (if throwaway) image to GHCR, which a
# PR from every contributor should not do on every push.
name: self-test

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "fixtures/**"
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  rust-gate-selftest:
    uses: ./.github/workflows/rust-gate.yml
    with:
      working-directory: fixtures/rust-hello

  go-gate-selftest:
    uses: ./.github/workflows/go-gate.yml
    with:
      working-directory: fixtures/go-hello

  python-gate-selftest:
    uses: ./.github/workflows/python-gate.yml
    with:
      working-directory: fixtures/python-hello

  ts-gate-selftest:
    uses: ./.github/workflows/ts-gate.yml
    with:
      working-directory: fixtures/ts-hello

  image-publish-selftest:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/image-publish.yml
    with:
      image: ghcr.io/qpmatrix/qpm-gh-workflows-selftest
      dockerfile: fixtures/docker-hello/Dockerfile
      context: fixtures/docker-hello
    secrets: inherit
