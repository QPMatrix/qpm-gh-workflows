# Reusable CD publish (ADR-031 f/g), generalising
# qp-infrastructure/.github/workflows/publish-sandbox.yml's already-proved
# shape: multi-arch `docker buildx build`, GHCR push under GITHUB_TOKEN
# `packages: write`, cosign KEYLESS signing (the job's own OIDC token as
# identity — no signing key anywhere to leak, secrets-and-tenancy rule 1),
# the digest written to the job summary AND a workflow output.
#
# It NEVER runs format/lint/tests — branch protection (merge-cycle's
# `cycle.py protect`) guarantees `main` only receives commits that already
# passed a PR's gate, so CD's only job is to publish what the gate already
# proved (ADR-031 f). The build is warm from the PR gate's own `image` job
# via `cache-from: type=gha` — the SAME cache scope key
# (`${{ github.repository }}`-scoped by GitHub, shared across workflows in
# one repo), so a merge's first CD build reuses layers the PR already
# built rather than starting cold.
#
# Some Dockerfiles need a private-repo BuildKit secret at build time (e.g.
# qp-gateway's cargo git dependency, qp-ingest's go.mod private modules) —
# this workflow mints the same QPMatrix installation token the gate
# workflows do and exposes it under BOTH `qpmatrix_token` and
# `qpsecondbrain_token` build-secret ids (QPMSEC-415: both names now
# resolve to the identical token since the org merge; an unreferenced
# secret id a Dockerfile does not mount is simply unused, never an error).
#
# The optional `version` input (spec 002-versioned-auto-deploy T-001,
# plan.md D2, QPMSEC-726/QPMSEC-707) is additive: empty (the default,
# every caller not yet migrated to semver-tag.yml) renders the `meta`
# step's `tags:` exactly as before — `main-{{sha}}` + `latest`; a bare
# semver string (the caller passes `needs.release.outputs.version` from
# semver-tag.yml) replaces that with `v<version>` + `latest` for that run
# only. No other step changes — cosign keyless signing, the private-deps
# mint, provenance/sbom, and the digest job summary are all untouched.
#
# Every `uses:` below is pinned by commit SHA with its tag as a trailing
# comment. Verified live 2026-09-03, re-verified 2026-09-09 for this
# change (repo-gates-and-hooks rule 8 — the same table publish-
# sandbox.yml's own header verified 2026-08-28):
#   gh api repos/actions/checkout/releases/latest --jq .tag_name                 -> v7.0.1
#   gh api repos/docker/setup-qemu-action/releases/latest --jq .tag_name         -> v4.3.0
#   gh api repos/docker/setup-buildx-action/releases/latest --jq .tag_name       -> v4.3.0
#   gh api repos/docker/login-action/releases/latest --jq .tag_name              -> v4.6.0
#   gh api repos/docker/metadata-action/releases/latest --jq .tag_name           -> v6.2.0
#   gh api repos/docker/build-push-action/releases/latest --jq .tag_name         -> v7.3.0
#   gh api repos/sigstore/cosign-installer/releases/latest --jq .tag_name        -> v4.1.2
#   gh api repos/actions/create-github-app-token/releases/latest --jq .tag_name  -> v3.2.0
#
# Runner selection (QPMSEC-630): the publish job's `runs-on:` is a flag,
# never a literal — `inputs.runner_heavy`, then the caller repo's
# `QPM_RUNNER_HEAVY` Actions variable, then `inputs.runner` /
# `QPM_RUNNER`, then `ubuntu-latest`. The runner host does not change
# what is signed: the OIDC token cosign uses as identity is issued by
# GitHub's OIDC provider to the JOB, whatever machine runs it, and a
# Ubicloud runner is a GitHub just-in-time runner registered through
# GitHub's own REST API — so the certificate identity verified below,
# the GHCR push under GITHUB_TOKEN and the App merge flow are all
# unchanged. Precedence, labels and doc references: README "Runners".
name: image-publish

on:
  workflow_call:
    inputs:
      image:
        description: Full GHCR image path, e.g. ghcr.io/qpmatrix/qp-gateway.
        type: string
        required: true
      dockerfile:
        type: string
        required: false
        default: Dockerfile
      context:
        type: string
        required: false
        default: "."
      platforms:
        type: string
        required: false
        default: linux/amd64
      private-deps:
        description: >-
          Comma- or newline-separated QPMatrix repo names this build needs
          a token for (see header). Empty skips the mint and passes no
          build secret.
        type: string
        required: false
        default: ""
      version:
        description: >-
          Bare semver (no leading v, e.g. "0.1.1") from
          semver-tag.yml's `version` output — spec 002-versioned-
          auto-deploy T-001, plan.md D2. Empty (the default, every
          caller not yet migrated) renders `main-{{sha}}`/`latest`,
          byte-identical to before this input existed. A non-empty
          value replaces that entirely with `v<version>`/`latest`.
        type: string
        required: false
        default: ""
      runner:
        description: >-
          Runner label for every job in this workflow (QPMSEC-630). Empty
          (the default) falls through to the caller repo's QPM_RUNNER
          Actions variable, then to ubuntu-latest — README "Runners".
        type: string
        required: false
        default: ""
      runner_heavy:
        description: >-
          Runner label for the publish job (the multi-arch image build).
          Empty (the default) falls through to QPM_RUNNER_HEAVY, then to
          runner / QPM_RUNNER, then to ubuntu-latest — README "Runners".
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: The published image's content digest (sha256:...).
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ${{ inputs.runner_heavy || vars.QPM_RUNNER_HEAVY || inputs.runner || vars.QPM_RUNNER || 'ubuntu-latest' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - if: inputs.private-deps != ''
        name: Mint QPMatrix installation token
        id: qpmatrix-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix
          repositories: ${{ inputs.private-deps }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=${{ inputs.version != '' && format('v{0}', inputs.version) || 'main-{{sha}}' }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          secrets: |
            qpmatrix_token=${{ steps.qpmatrix-token.outputs.token }}
            qpsecondbrain_token=${{ steps.qpmatrix-token.outputs.token }}

      - name: Sign the published image (cosign keyless) and verify it
        env:
          IMAGE_REFERENCE: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/QPMatrix/qpm-gh-workflows/\.github/workflows/image-publish\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REFERENCE"

      - name: Record the published digest
        run: |
          {
            echo "## ${{ inputs.image }} published and signed"
            echo
            echo '```'
            echo "${{ inputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags: ${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
