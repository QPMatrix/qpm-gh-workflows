# Tags this repository's own releases. semver-tag.yml is a reusable workflow
# every consumer calls to version itself; until today nothing called it for
# the repository that owns it, so the shared workflows sat at v0.3.0 while
# main moved on — and every caller in the estate pins @main because there was
# no tag that contained what they needed (QPAI-136). The release mechanism now
# applies to the repository that ships it.
#
# A reusable workflow receives NONE of the caller's secrets unless passed —
# and that is true for a local `uses: ./` call too. The first run of this
# file died at the App-token mint with an empty client id for exactly that
# reason, which also corrects a claim made earlier today: self-test.yml does
# not "inherit secrets because it is local"; it never reaches the mint,
# because its fixtures declare no private dependencies. The one path the
# self-test never exercises is the one that needs a secret.
#
# push-to-main only: a tag is cut from what was merged, never from a PR.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/semver-tag.yml
    secrets: inherit
