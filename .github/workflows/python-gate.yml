# Callers with non-empty private-deps MUST pass `secrets: inherit` on
# the calling job (or explicitly map QPASSISTANCE_CLIENT_ID and
# QPASSISTANCE_PRIVATE_KEY). See docs/workflows.md, "Caller secrets".
# Empty private-deps needs no secrets and skips the token mint.
#
# Reusable PR-only quality gate for a Python service repo (ADR-031). Three
# jobs run in PARALLEL — format-lint, test, image — each calling the
# caller repo's own `./check <stage>` so hook ⊆ CI holds by construction
# (repo-gates-and-hooks rule 4).
#
# Trigger/concurrency live in the CALLER (ADR-031 a/b); this file only
# declares `workflow_call`. Docs-only short-circuit (ADR-031 c) — see
# rust-gate.yml's header for the full reasoning.
#
# Caching (ADR-031 e): `astral-sh/setup-uv`'s own `enable-cache: true`
# (keyed on uv.lock/pyproject.toml automatically).
#
# Per-repo tool hook (QPMSEC-570 round 7): a repo's contracts-gen.sh (or
# equivalent) can need tools this reusable workflow has no business
# hardcoding — protoc-gen-go/protoc-gen-go-grpc, protoc-gen-prost/
# protoc-gen-tonic, and whatever future repos in the leg-B rollout
# (QPMSEC-577, ~30 repos) bring with them. `scripts/ci-tools.sh`, when
# present in the caller's working-directory, is run BEFORE every stage in
# every job that runs one (format-lint, test, image) — cached on its own
# hash (a version bump inside the script busts the cache automatically,
# no separate version-keyed input needed). The hook is the REPO's own
# responsibility: this workflow only checks for the file and runs it,
# never inspects or hardcodes its contents — same shape as the existing
# `scripts/install-buf.sh` step below, generalised. `./check` (no
# arguments) is UNCHANGED for a human running it locally — they install
# tools per the repo's own README, same as always; this hook is CI-only.
# Real incident this closes: qpsb-ingest/qpsb-gateway's PRs #36/#33 went
# red within 12 seconds — `protoc-gen-go`/`protoc-gen-prost` "not found
# on PATH" — because the OLD hand-written ci.yml these thin callers
# replaced carried per-repo tool-install steps this reusable workflow
# never replicated.
#
# Alternatives considered and rejected: (a) hardcode the protoc plugins
# into THIS file — couples a shared workflow to two specific repos'
# choices and does not scale to ~30 repos with different toolchains;
# (b) have contracts-gen.sh self-install missing tools on demand — mixes
# CI bootstrapping into a script a human also runs locally, and the
# coordinator's own instruction is that `./check` stays human-unchanged;
# (c) a flat `extra-tools:` string input parsed generically — every
# repo's real install recipe (go install, cargo install, a checksum-
# verified curl download) differs too much to express safely as one
# input shape. The hook script (this repo's existing `install-buf.sh`
# pattern, now with one more file the gate looks for) needed none of
# that: zero new inputs, and each repo's install recipe stays exactly
# what it already is.
#
# The `image` job's mint step used to have NO matching git-auth
# `insteadOf` config step (round 7 review, found live in qpsb-ingest's
# own failing run: `./check image`'s trailing repo-instructions fetch —
# `scripts/qp-skills-fetch.sh`, private repo — failed
# `fatal: could not read Username for 'https://github.com'`, exit 128,
# because the token from the mint step was exported to `./check image`'s
# BuildKit secret env vars but git itself was never configured to use
# it). Fixed the same way format-lint/test already had it.
#
# Every `uses:` below is pinned by commit SHA with its tag as a trailing
# comment. Verified live 2026-09-03 (repo-gates-and-hooks rule 8):
#   gh api repos/actions/checkout/releases/latest --jq .tag_name                 -> v7.0.1
#   gh api repos/astral-sh/setup-uv/releases/latest --jq .tag_name               -> v10.0.1 (sha 20cfd1bf945f4377ade1205e4dbc17946fc9a30d)
#   gh api repos/actions/create-github-app-token/releases/latest --jq .tag_name  -> v3.2.0
#
# Runner selection (QPMSEC-630): every `runs-on:` below is a flag, never a
# literal — `inputs.runner`, then the caller repo's `QPM_RUNNER` Actions
# variable, then `ubuntu-latest`. Why a flag: GitHub-hosted minutes ran
# out estate-wide on 2026-09-06; the account is a USER account (no
# org-level variables), so the switch is a per-repo variable the
# orchestrator sets — callers need no edit. Precedence, labels and the
# proof live in README "Runners" (one home, not five headers).
name: python-gate

on:
  workflow_call:
    inputs:
      private-deps:
        description: >-
          Comma- or newline-separated QPMatrix repo names this repo fetches
          over git (uv git dependencies) — the mandatory qpai-skills source included by the CALLER, not assumed here. Empty
          skips the mint entirely.
        type: string
        required: false
        default: ""
      working-directory:
        description: Directory (relative to repo root) the caller's project lives in — used by the self-test workflow to point at an in-repo fixture; real callers leave it at ".".
        type: string
        required: false
        default: "."
      runner:
        description: >-
          Runner label for every job in this workflow (QPMSEC-630). Empty
          (the default) falls through to the caller repo's QPM_RUNNER
          Actions variable, then to ubuntu-latest — README "Runners".
        type: string
        required: false
        default: ""
      python-version-file:
        type: string
        required: false
        default: ".python-version"

jobs:
  changes:
    runs-on: ${{ inputs.runner || vars.QPM_RUNNER || 'ubuntu-latest' }}
    outputs:
      docs_only: ${{ steps.docs-only.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: docs-only
        name: Detect a docs-only change (ADR-031 c)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="HEAD~1"
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$|^\.gitignore$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  format-lint:
    needs: changes
    runs-on: ${{ inputs.runner || vars.QPM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version-file: ${{ inputs.python-version-file }}
      - if: needs.changes.outputs.docs_only != 'true' && inputs.private-deps != ''
        name: Mint QPMatrix installation token
        id: qpmatrix-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix
          repositories: ${{ inputs.private-deps }}
      - if: needs.changes.outputs.docs_only != 'true' && inputs.private-deps != ''
        name: Configure git auth for QPMatrix
        run: git config --global url."https://x-access-token:${QPMATRIX_TOKEN}@github.com/QPMatrix/".insteadOf "https://github.com/QPMatrix/"
        env:
          QPMATRIX_TOKEN: ${{ steps.qpmatrix-token.outputs.token }}
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) != ''
        name: Cache CI tools (scripts/ci-tools.sh)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ci-tools-${{ runner.os }}-${{ hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) }}
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) != ''
        name: Install CI tools (scripts/ci-tools.sh)
        working-directory: ${{ inputs.working-directory }}
        run: |
          sh scripts/ci-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - if: needs.changes.outputs.docs_only != 'true'
        run: ./check fmt
        working-directory: ${{ inputs.working-directory }}
      - if: needs.changes.outputs.docs_only != 'true'
        run: ./check lint
        working-directory: ${{ inputs.working-directory }}

  test:
    needs: changes
    runs-on: ${{ inputs.runner || vars.QPM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version-file: ${{ inputs.python-version-file }}
      - if: needs.changes.outputs.docs_only != 'true' && inputs.private-deps != ''
        name: Mint QPMatrix installation token
        id: qpmatrix-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix
          repositories: ${{ inputs.private-deps }}
      - if: needs.changes.outputs.docs_only != 'true' && inputs.private-deps != ''
        name: Configure git auth for QPMatrix
        run: git config --global url."https://x-access-token:${QPMATRIX_TOKEN}@github.com/QPMatrix/".insteadOf "https://github.com/QPMatrix/"
        env:
          QPMATRIX_TOKEN: ${{ steps.qpmatrix-token.outputs.token }}
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) != ''
        name: Cache CI tools (scripts/ci-tools.sh)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ci-tools-${{ runner.os }}-${{ hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) }}
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) != ''
        name: Install CI tools (scripts/ci-tools.sh)
        working-directory: ${{ inputs.working-directory }}
        run: |
          sh scripts/ci-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - if: needs.changes.outputs.docs_only != 'true'
        run: ./check test
        working-directory: ${{ inputs.working-directory }}

  image:
    needs: changes
    runs-on: ${{ inputs.runner || vars.QPM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/Dockerfile', inputs.working-directory)) != '' && inputs.private-deps != ''
        name: Mint QPMatrix installation token
        id: qpmatrix-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix
          repositories: ${{ inputs.private-deps }}
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/Dockerfile', inputs.working-directory)) != '' && inputs.private-deps != ''
        name: Configure git auth for QPMatrix
        run: git config --global url."https://x-access-token:${QPMATRIX_TOKEN}@github.com/QPMatrix/".insteadOf "https://github.com/QPMatrix/"
        env:
          QPMATRIX_TOKEN: ${{ steps.qpmatrix-token.outputs.token }}
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) != ''
        name: Cache CI tools (scripts/ci-tools.sh)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: ci-tools-${{ runner.os }}-${{ hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) }}
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/scripts/ci-tools.sh', inputs.working-directory)) != ''
        name: Install CI tools (scripts/ci-tools.sh)
        working-directory: ${{ inputs.working-directory }}
        run: |
          sh scripts/ci-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - if: needs.changes.outputs.docs_only != 'true' && hashFiles(format('{0}/Dockerfile', inputs.working-directory)) != ''
        name: ./check image
        run: ./check image
        working-directory: ${{ inputs.working-directory }}
        env:
          QPMATRIX_TOKEN: ${{ steps.qpmatrix-token.outputs.token }}
