# Gate = ./check, mirrored by .githooks/pre-commit (parity rule).
# checkout pin verified at birth via:
#   gh api repos/actions/checkout/releases/latest --jq .tag_name  -> v7.0.1
#
# Private cross-repo dependencies (QPMSEC-345, and QPMSEC-436 review round 2 finding 2 for qpsb-skills/qpsb-agents which every born repo now depends on): QPMatrix/qpsb-skills, QPMatrix/qpsb-agents.
# The default GITHUB_TOKEN cannot fetch a private repo, so this
# workflow mints a scoped App installation token and rewrites git
# URLs to use it (pattern: qp-context/.github/workflows/ci.yml).
# create-github-app-token pin verified at birth via:
#   gh api repos/actions/create-github-app-token/releases/latest --jq .tag_name  -> v3.2.0
# The RELEASE workflow needs this SAME fix, added separately — it
# is not seeded here. A NEW private dep added later to an EXISTING
# repo needs the token's `repositories:` widened in BOTH
# workflows. repo-birth SKILL.md, "Private cross-repo dependencies".
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Mint QPMatrix installation token (qpsb-skills, qpsb-agents)
        id: qpmatrix-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix
          repositories: |
            qpsb-skills
            qpsb-agents
      - name: Configure git auth for QPMatrix
        run: |
          git config --global url."https://x-access-token:${QPMATRIX_TOKEN}@github.com/QPMatrix/".insteadOf "https://github.com/QPMatrix/"
        env:
          QPMATRIX_TOKEN: ${{ steps.qpmatrix-token.outputs.token }}
      - run: ./check
