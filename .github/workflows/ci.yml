# Gate = ./check, mirrored by .githooks/pre-commit (parity rule). Every
# uses: below is pinned by commit SHA with its tag as a trailing comment.
# checkout pin verified at birth via:
#   gh api repos/actions/checkout/releases/latest --jq .tag_name  -> v7.0.1
#
# Private cross-repo dependencies (QPMSEC-345, and QPMSEC-436 review round 2 finding 2 for qpai-skills which every born repo now depends on): QPMatrix/qpai-skills.
# The default GITHUB_TOKEN cannot fetch a private repo, so this
# workflow mints a scoped App installation token and rewrites git
# URLs to use it (pattern: qp-context/.github/workflows/ci.yml).
# create-github-app-token pin verified at birth via:
#   gh api repos/actions/create-github-app-token/releases/latest --jq .tag_name  -> v3.2.0
# The RELEASE workflow needs this SAME fix, added separately — it
# is not seeded here. A NEW private dep added later to an EXISTING
# repo needs the token's `repositories:` widened in BOTH
# workflows. repo-birth SKILL.md, "Private cross-repo dependencies".
#
# ADR-031 a/b (QPMSEC-570 round 3 finding 4): this repo's own gate is a
# gate exactly like every one it births into other repos — pull_request +
# workflow_dispatch only, never push (branch protection already
# guarantees main only receives commits that passed a PR's gate; a
# push:[main] re-run of the identical gate re-checks nothing new), with
# a cancel-in-progress concurrency group so a fixup push doesn't run every
# superseded commit's gate to completion.
#
# Runner selection (QPMSEC-630): this repo's own gate is not a
# `workflow_call` workflow, so it has no `inputs.runner` — the flag is
# the repo's `QPM_RUNNER` Actions variable alone, falling back to
# `ubuntu-latest`. README "Runners".
name: ci
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    runs-on: ${{ vars.QPM_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint QPMatrix installation token (qpai-skills)
        id: qpmatrix-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QPASSISTANCE_CLIENT_ID }}
          private-key: ${{ secrets.QPASSISTANCE_PRIVATE_KEY }}
          owner: QPMatrix
          repositories: |
            qpai-skills
      - name: Configure git auth for QPMatrix
        run: |
          git config --global url."https://x-access-token:${QPMATRIX_TOKEN}@github.com/QPMatrix/".insteadOf "https://github.com/QPMatrix/"
          git config --global --add url."https://x-access-token:${QPMATRIX_TOKEN}@github.com/QPMatrix/".insteadOf "ssh://git@github.com/QPMatrix/"
          git config --global --add url."https://x-access-token:${QPMATRIX_TOKEN}@github.com/QPMatrix/".insteadOf "git@github.com:QPMatrix/"
        env:
          QPMATRIX_TOKEN: ${{ steps.qpmatrix-token.outputs.token }}
      - run: ./check
